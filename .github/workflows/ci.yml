name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: npm run check
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - name: Every install script has a decision (STACK-7)
        run: |
          npm install-scripts ls
          npm install-scripts ls --json | node -e 'process.exit(JSON.parse(require("fs").readFileSync(0, "utf8")).allowScripts.length ? 1 : 0)'
      - run: npm run check

  e2e:
    name: npm run test:e2e
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      # The project's own Playwright installs the matching Chromium and its system libraries (TEST-6).
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
