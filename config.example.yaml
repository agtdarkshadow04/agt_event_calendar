# AGT Event Calendar configuration (config.yaml)
#
# Copy this file to config.yaml and uncomment what you need. Every key is
# optional; the value shown is the default. Unknown keys are rejected and the
# server refuses to start with an error naming the bad key.
#
# Precedence rule — the config file always wins. Any setting defined here is shown as
# read-only in the admin dashboard, and the API rejects attempts to change it.
# Settings left out here can be changed in the dashboard (Settings tab).
#
# Secrets do NOT belong in this file: AGT_SETUP_PASSWORD goes in .env.
# This file is mounted read-only and is included in backups.

# server:
  # Address and port the HTTP server listens on (plain HTTP; put your own
  # TLS-terminating reverse proxy in front of it).
  # host: 0.0.0.0
  # port: 8080
  # Set to true (or to the proxy's IP or CIDR range) when the app runs behind
  # a reverse proxy, so client IPs and https are detected correctly.
  # trustProxy: false
  # One of fatal, error, warn, info, debug, trace, silent.
  # logLevel: info

# storage:
  # Relative paths resolve against the working directory (/app in Docker).
  # dataDir: data
  # databaseFile: agt-calendar.sqlite   # relative to dataDir
  # uploadsDir: uploads                 # relative to dataDir
  # backupsDir: backups                 # relative to dataDir (pre-restore backups)
  # logDatabaseFile: logs.sqlite        # relative to dataDir; server log and audit log, never in backups

# session:
  # Admin session lifetime in hours.
  # ttlHours: 12
  # auto marks the cookie Secure when the request arrived over https
  # (requires trustProxy behind a proxy); true or false forces it.
  # secureCookie: auto

# rateLimits:
  # login:
    # max: 10
    # windowMinutes: 15
  # setup:
    # max: 10
    # windowMinutes: 15
  # adminUploads:
    # max: 120
    # windowMinutes: 15

# altcha:
  # HMAC key for the self-hosted ALTCHA captcha (at least 32 characters).
  # When unset, a random key is generated once and stored in the database.
  # hmacKey: replace-with-a-long-random-string
  # Proof-of-work cost; higher is slower for visitors and bots alike.
  # cost: 5000
  # challengeTtlSeconds: 600

# ---------------------------------------------------------------------------
# The settings below can also be edited in the admin dashboard, unless they
# are defined here.
# ---------------------------------------------------------------------------

# site:
  # title: AGT Event Calendar
  # supportUrl: https://www.nms-agt.com/support
  # glyphToolUrl: https://glyph.nms-agt.com/

# submissions:
  # Accept public event submissions. When false, the server rejects them.
  # enabled: true
  # rateLimit:
    # max: 5
    # windowMinutes: 60

# uploads:
  # Maximum image size in bytes; capped at 10 MB (10485760).
  # maxImageBytes: 10485760

# migration:
  # Limits for "Migrate from Amplify" and backup restore uploads.
  # maxZipBytes: 209715200
  # maxUncompressedBytes: 1073741824
  # maxEntries: 10000

# logs:
  # Retention of the server log and the audit log. Entries older than the
  # number of days are deleted hourly; above the cap, the oldest go first
  # (for the audit log, failed and denied attempts before successful actions).
  # serverRetentionDays: 30      # 1–3650
  # serverMaxEntries: 100000     # 1000–10000000
  # auditRetentionDays: 365      # 30–3650; at least 30 so recent history cannot be erased
  # auditMaxEntries: 1000000     # 10000–10000000
