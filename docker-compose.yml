services:
  calendar:
    build: .
    image: agt-event-calendar:latest
    restart: unless-stopped
    # Plain HTTP only, so the port is published on this host's loopback interface only (SEC-4).
    # Put a TLS-terminating reverse proxy in front (README: TLS and reverse proxies) and set
    # server.trustProxy. Publish on another interface only if that proxy runs on another machine.
    ports:
      - "127.0.0.1:8080:8080"
    # Secrets and bootstrap values (AGT_SETUP_PASSWORD). See .env.example.
    env_file:
      - path: .env
        required: false
    volumes:
      # SQLite database, uploaded images and automatic pre-restore backups.
      - calendar-data:/app/data
      # Configuration, mounted read-only. The config file always wins over
      # dashboard settings. See config.example.yaml.
      - ./config.yaml:/app/config.yaml:ro
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/api/health').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3

volumes:
  calendar-data:
